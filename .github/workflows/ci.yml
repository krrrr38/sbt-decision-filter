name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.sbt }}, java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
        sbt: [sbt1, sbt2]
        include:
          - sbt: sbt1
            scala: 2.12.21
          - sbt: sbt2
            scala: 3.8.4
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Test
        run: sbt -batch "++${{ matrix.scala }}" test sbtPluginJev/scripted
